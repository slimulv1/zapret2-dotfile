# z2d-sysctl.conf — 18 khoá hardening, nguồn sysctl DUY NHẤT.
#
# ⚠ VÌ SAO FILE NÀY TỒN TẠI, VÌ SAO KHÔNG ĐỂ TRONG /etc/sysctl.d/
#   Gói ufw 0.36.x nạp /etc/ufw/sysctl.conf mỗi lần `ufw` chạy. File đó của
#   ufw có 57 dòng và **ghi đè 2 khoá của ta**:
#       default.rp_filter  2 → 1
#       all.log_martians   1 → 0
#   Đo 28/09: sau `ufw reload`, hai khoá này bị đặt lại. Đặt file của ta vào
#   /etc/sysctl.d/ không cứu được, vì ufw nạp *sau* và thắng.
#
#   Cách đúng: trỏ IPT_SYSCTL trong /etc/default/ufw sang file này.
#   Đã kiểm thực tế trên máy: `ufw reload` không còn đụng 2 khoá nữa.
#
#   install.sh còn cài 2 lớp phòng thủ nữa, phòng khi ai đó sửa /etc/default/ufw:
#     - drop-in systemd:  /etc/systemd/system/ufw.service.d/10-z2d-reapply-sysctl.conf
#     - hook pacman:      /etc/pacman.d/hooks/30-z2d-ufw.hook
#   Cả ba cùng làm một việc: sau khi ufw chạy, sysctl của ta được nạp lại.
#
# GIÁ TRỊ CHỌN VÌ SAO
#   rp_filter = 2 (loose)  : chế độ strict (1) loại bỏ gói khi nguồn không đi
#                           đúng cổng — với CGNAT và VPN hay rơi gói. Loose vẫn
#                           chống spoofing mà không rơi gói thật.
#   log_martians = 1       : ghi nhận gói đáng ngờ thay vì âm thầm bỏ.
#   accept_source_route = 0: chặn định tuyến nguồn giả mạo.
#   accept_redirects    = 0: chặn định tuyến chuyển hướng từ mạng ngoài.
#   icmp_echo_ignore_broadcasts = 1 : chống khuếch đại ping.
#   icmp_echo_ignore_all         = 0 : GIỮ ping — tắt nó sẽ phá mọi lệnh kiểm
#                           mạng kể cả của chính bộ kiểm này.
#
# LƯU Ý: sysctl dùng dấu CHẤM (net.ipv4.conf.all.rp_filter).
#   sysctl(8) đọc dấu chấm. Kiểu dùng dấu gạch chéo chỉ đúng cho /proc/sys.
#   File /etc/sysctl.d/ chấp nhận cả hai, nhưng đừng lẫn.

net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_echo_ignore_all = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
fs.suid_dumpable = 0
