# z2d-ufw-reapply-sysctl — drop-in systemd cho ufw.service
#
# VÌ SAO CẦN
#   Gói ufw nạp /etc/ufw/sysctl.conf mỗi lần nó chạy. File đó đặt 2 khoá
#   NGƯỢC với thiết kế của ta:
#       net.ipv4.conf.default.rp_filter   2 (ta) → 1 (ufw)
#       net.ipv4.conf.all.log_martians    1 (ta) → 0 (ufw)
#
#   Đo 28/09, cô lập từng lệnh trên máy thật:
#       ufw status verbose ................. không đổi
#       ufw allow ... ..................... không đổi
#       ufw default deny incoming ......... ĐỔI   ← chính bước này của installer
#       ufw --force reload ................ ĐỔI
#       systemctl restart ufw ............. ĐỔI
#
#   Và nó sống sót qua reboot: ufw.service chạy SAU systemd-sysctl.service,
#   nên sau mỗi lần khởi động, giá trị của ufw là giá trị CUỐI CÙNG.
#   Đặt file của ta trong /etc/sysctl.d/ KHÔNG cứu được, vì ufw nạp sau và thắng.
#
# CÁCH SỬA
#   Drop-in trong /etc/systemd/system/ufw.service.d/ — KHÔNG sửa tệp của gói,
#   nên pacman không bao giờ ghi đè. ExecStartPost chạy SAU khi ufw đã nạp
#   sysctl.conf của nó, nên đè lại đúng thứ tự. Mọi lần ufw khởi động — boot,
#   `systemctl restart ufw`, `ufw reload` — đều tự lành.
#
# ⚠ CÒN MỘT LỖ HỔNG, ĐÃ BIẾT, ĐÃ GHI Ở ĐÂY THÌ MỚI THẬT SỰ BIẾT
#   `ufw --force reload` chạy thẳng từ CLI, KHÔNG đi qua systemd service nên
#   ExecStartPost không bắn. Sau lệnh đó phải chạy tay:
#       sudo sysctl --system
#   install.sh còn hai lớp nữa (IPT_SYSCTL trong /etc/default/ufw, và hook
#   pacman) để phủ cả nhánh đó. Lớp này là lớp phủ systemd.
#
# KIỂM CHỨNG
#   sudo systemctl restart ufw
#   sysctl -n net.ipv4.conf.all.log_martians     # phải là 1
#   sysctl -n net.ipv4.conf.default.rp_filter    # phải là 2

[Service]
ExecStartPost=/usr/bin/sysctl --system
