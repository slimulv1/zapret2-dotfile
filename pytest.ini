[pytest]
testpaths = tests
# BỎ ĐỐI SỐ `addopts` không? giữ nguyên: tự động bỏ test phá huỷ.
# KHÔNG đặt `-m "not destructive"` ở đây.
# Lọc bằng marker sẽ GHI ĐÈ cờ opt-in: `--run-destructive` xong vẫn bị bỏ
# hết 18 test phá-huỷ, và người đọc tưởng bộ test chạy đủ.
# Việc chặn do fixture `destructive` đảm nhiệm — đúng chỗ hơn, vì nó đọc
# được cờ dòng lệnh và in lý do bỏ qua.
addopts =
    -ra
    --strict-markers
markers =
    invariants: quét invariant §4
    install: cần chạy cài
    uninstall: cần chạy gỡ
    destructive: đổi máy thật — cần --run-destructive
    network: cần mạng thật
    slow: chạy lâu
    airgap: mất mạng / thiếu công cụ
